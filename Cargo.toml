[package]
name="cbgpu-agent-native"
version="0.2.0"
edition="2024"
rust-version="1.88"
license="Apache-2.0"
[lib]
path="native/lib.rs"
[[bin]]
name="cbgpu"
path="native/main.rs"
[dependencies]
tokio={version="1",features=["full"]}
reqwest={version="0.12",default-features=false,features=["rustls-tls","json"]}
serde={version="1",features=["derive"]}
serde_json="1"
regex="1"
sha2="0.10"
globset="0.4"
walkdir="2"
rpassword="7"
dirs="6"
tempfile="3"
async-trait="0.1"
[target.'cfg(unix)'.dependencies]
libc="0.2"
[[test]]
name="contracts"
path="native/tests/contracts.rs"
[[test]]
name="agent"
path="native/tests/agent.rs"

[[test]]
name = "stdio"
path = "native/tests/stdio.rs"
